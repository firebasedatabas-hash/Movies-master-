name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Java 21 setup
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Native Android APK
        run: |
          mkdir -p dist
          echo "<html><body>Loading...</body></html>" > dist/index.html
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Capacitor Configuration (Website URL)
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.moviemaster.pro",
            "appName": "Movie Master Pro",
            "webDir": "dist",
            "server": {
              "url": "https://firebasedatabas-hash.github.io/Movies-master-/",
              "cleartext": true
            }
          }
          EOF

          # Android project create karein
          npx cap add android
          
          # Gradle ko zabardasti Java 21 par set karein (Is se error khatam hoga)
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: MovieMasterPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
