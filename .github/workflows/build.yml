name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Java 17 ko badal kar 21 kiya hai taake error na aaye
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Native Android APK
        run: |
          mkdir -p dist
          cp index.html dist/ 2>/dev/null || cp *.html dist/ 2>/dev/null || true
          
          # Initialize package.json agar pehle se mojood na ho
          npm init -y
          
          # Capacitor install karein
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Capacitor Configuration
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.moviemaster.pro",
            "appName": "Movie Master Pro",
            "webDir": "dist",
            "server": {
              "url": "https://firebasedatabas-hash.github.io/Movies-master-/",
              "cleartext": true
            }
          }
          EOF

          # Android platform add karein
          npx cap add android
          
          # Android build run karein
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: MovieMasterPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
