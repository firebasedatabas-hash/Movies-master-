name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Native Android APK
        run: |
          mkdir -p dist
          echo "<html><body>Loading Movie Master...</body></html>" > dist/index.html
          
          # Stable Capacitor 6 install karein
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          
          # Initialize project
          npx cap init "Movie Master Pro" "com.moviemaster.pro" --web-dir dist
          
          # Aapki website ka link connect kiya hai
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.moviemaster.pro",
            "appName": "Movie Master Pro",
            "webDir": "dist",
            "server": {
              "url": "https://firebasedatabas-hash.github.io/Movies-master-/",
              "cleartext": true
            }
          }
          EOF

          # Android platform add karein
          npx cap add android
          
          # Build APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: MovieMasterPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
